; UTF-8로 저장하세요. 시간 단위: 초. 숫자와 경로만 수정하세요.
[experiment]
set_size = 5
; 알파벳을 화면에 보여 주는 시간
memorize_seconds = 2.0
delay_seconds = 2.0
response_timeout_seconds = 3.0
trials = 24
calibration_trials = 10
practice_trials = 3
break_seconds = 30.0
post_calibration_wait_seconds = 10.0
intertrial_seconds = 1.0
; 비워두면 무작위 생성. 입력 CSV는 set,probe 열을 포함해야 합니다.
stimuli_file =
output_dir = results
; 비워두면 새 난수 시드 생성
seed =

[audio]
sample_rate = 44100
; 저역은 low_cutoff_hz 이하, 고역은 high_cutoff_hz 이상
low_cutoff_hz = 1000
high_cutoff_hz = 4000
; 상대 RMS 출력값. dB SPL이 아닙니다. 0 < quiet < loud <= 0.15
quiet_rms = 0.025
loud_rms = 0.050

[display]
fullscreen = false
width = 1100
height = 750
; 비워두면 설치된 한글 글꼴을 자동 탐색
font_file =
